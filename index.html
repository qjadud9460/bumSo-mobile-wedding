<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정범영과 방소현 결혼합니다🤍</title>
    <link rel="icon" href="images/favicon_1.png" type="image/x-icon">

    <meta property="og:title" content="정범영 🤍 방소현 결혼합니다" />
    <meta property="og:description" content="2026년 10월 9일 오후 5시, 저희의 소중한 날에 초대합니다." />
    <meta property="og:image" content="https://bumyoungsohyeon-wedding.vercel.app/images/link_main.webp" />
    <meta property="og:url" content="https://bumyoungsohyeon-wedding.vercel.app" />
    <meta property="og:type" content="website" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            color: #333;
            font-size: 16px; 
            overflow-y: scroll;
        }
        
        .wrap { 
            width: 100%; 
            max-width: 430px; 
            background-color: white; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            overflow-x: hidden; 
            position: relative; 
            padding-bottom: 50px; /* 하단바 공간 확보 */
        }
        
        section { padding: 4rem 1.5rem; text-align: center; }
        .title-eng { font-size: 1.8rem; color: #1c1c1c; font-weight: 700; margin-bottom: 0.5rem; }
        
        /* 스크롤 애니메이션 (기존 페이드업) */
        .fade-up { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease-out, transform 0.8s ease-out; }
        .fade-up.active { opacity: 1; transform: translateY(0); }

        /* 메인 섹션 (좌우 꽉 참) */
        .sec-main { 
            background-color: #fad4da; 
            padding: 0; 
            padding-bottom: 3rem;
            margin-bottom: 0;
        }
        .sec-main img {
            width: 100%; 
            height: 550px; 
            object-fit: cover; 
            display: block; 
        }

        /* --- [수정됨] 타이핑 애니메이션을 위한 텍스트 영역 스타일 --- */
        .sec-main .main-content {
            padding: 0 1.5rem;
            margin-top: 3rem;
            min-height: 180px; /* 텍스트가 사라질 때 높이 유지 */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 공통 타이핑 효과 설정 */
        .typing-text {
            overflow: hidden; /* 텍스트가 넘치면 숨김 */
            white-space: nowrap; /* 줄바꿈 방지 */
            margin: 0 auto; /* 가운데 정렬 유지 */
            border-right: 2px solid #333; /* 커서 깜빡임 효과 */
            animation: typing 2s steps(40, end), blink-caret 0.75s step-end infinite;
        }

        /* 각 텍스트별 애니메이션 딜레이 및 스타일 */
        .type-line-1 { 
            font-size: 1.5rem; font-weight: 700; color: #1c1c1c; letter-spacing: 1px;
            animation: typing 1.5s steps(20, end); 
            margin-bottom: 10px;
        }
        
        .type-line-2 { 
            font-size: 1.3rem; font-weight: bold; letter-spacing: 2px; 
            animation: typing 1.5s steps(15, end) 1.5s both; /* 1.5초 후 시작 */
            margin-top: 15px;
        }
        
        .type-line-3 { 
            font-size: 1rem; line-height: 1.6; margin-top: 15px;
            white-space: normal; /* 예식 정보는 줄바꿈 허용 */
            border-right: none; /* 마지막 줄은 커서 제거 */
            animation: fade-in 1s ease-in 3s both; /* 3초 후 서서히 등장 */
        }

        /* 타이핑 키프레임 */
        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        /* 커서 깜빡임 키프레임 */
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #333 }
        }

        /* 서서히 등장 키프레임 (마지막 줄용) */
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        /* ------------------------------------------- */

        .sec-invite { background-color: #1c1c1c; color: white; }
        .sec-invite h2 { color: #fad4da; font-size: 1.2rem; margin-bottom: 2rem; font-weight: normal; }
        .sec-invite p { line-height: 2; font-size: 0.95rem; color: #e5e7eb; }
        
        .sub-photos { display: flex; gap: 10px; margin-top: 3rem; }
        .sub-photo-item { flex: 1; text-align: center; }
        .sub-photo-item img { width: 100%; height: 250px; object-fit: cover; border-radius: 12px; }
        .sub-photo-item span { display: block; margin-top: 8px; font-size: 0.9rem; color: #fad4da; }
        
        .sec-gallery { background-color: #f0eadd; padding-bottom: 3rem; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 2rem; }
        .hidden-gallery { display: none; }
        .hidden-gallery.show { display: grid; }
        .more-btn { background-color: #1c1c1c; color: #fff; border: none; padding: 10px 24px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; margin-top: 2rem; }

        .sec-calendar { background-color: #fad4da; padding: 3rem 1.5rem; }
        .sec-calendar img { width: 100%; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        .sec-info { background-color: #ffffff; padding: 5rem 1.5rem; }
        .parking-title { font-size: 1.3rem; color: #e5a4af; font-weight: bold; margin-bottom: 2rem; }
        .info-text { font-size: 1rem; line-height: 1.8; color: #444; word-break: keep-all; }
        .dining-box { position: relative; border: 2px solid #f6d1d6; border-radius: 12px; padding: 3rem 1rem 2rem 1rem; margin-top: 4.5rem; }
        .dining-badge { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); background-color: #f6d1d6; color: #ffffff; font-size: 1.1rem; padding: 8px 35px; border-radius: 30px; font-weight: 500; }
        .dining-text { font-size: 0.95rem; line-height: 1.9; color: #444; }

        .sec-map { background-color: #1c1c1c; color: white; }
        .sec-map h2 { color: #fad4da; font-size: 1.2rem; margin-bottom: 2rem; font-weight: normal; }
        .map-info { margin-top: 1.5rem; font-size: 0.95rem; line-height: 1.8; color: #d1d5db; }
        .map-info strong { color: white; font-size: 1.1rem; }

        .sec-account { background-color: #1c1c1c; border-top: 1px dashed #444; padding-bottom: 4rem; }
        .sec-account h2 { color: #fad4da; font-size: 1.2rem; margin-bottom: 2rem; font-weight: normal; }
        details { background-color: #2a2a2a; border-radius: 8px; margin-bottom: 1rem; text-align: left; overflow: hidden; }
        summary { padding: 1rem; color: white; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; list-style: none; }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '+'; font-size: 1.2rem; color: #fad4da; transition: transform 0.3s; }
        details[open] summary::after { transform: rotate(45deg); }
        .account-body { padding: 1rem; background-color: white; color: #333; font-size: 0.95rem; border-top: 1px solid #ddd; }
        .account-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .copy-btn { background-color: #e5e7eb; border: none; padding: 5px 12px; border-radius: 4px; font-size: 0.85rem; cursor: pointer; }

        .bottom-bar { 
            background-color: #fcfafa; padding: 1rem; display: flex; gap: 0.5rem; 
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 430px; z-index: 1000; box-shadow: 0 -5px 10px rgba(0,0,0,0.05);
        }
        .btn { flex: 1; padding: 0.9rem; border-radius: 12px; font-size: 1rem; border: none; font-weight: bold; cursor: pointer; }
        .btn-link { background-color: #e5e7eb; color: #333; }
        .btn-kakao { background-color: #fae100; color: #3c1e1e; }

        .bgm-btn {
            position: fixed; bottom: 80px; right: 20px;
            background-color: rgba(28, 28, 28, 0.85); color: #fad4da;
            border: 1px solid #fad4da; border-radius: 50px; padding: 8px 16px;
            font-size: 0.85rem; cursor: pointer; z-index: 999;
            display: flex; align-items: center; gap: 5px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        
        <audio id="bgm" src="images/bgm.mp3" loop></audio>
        <button class="bgm-btn" id="bgmToggleBtn" onclick="toggleBGM()">
            🎵 BGM <span>OFF</span>
        </button>

        <section class="sec-main">
            <img src="images/main.webp" alt="메인 사진" loading="lazy">
            <div class="main-content">
                <div class="typing-text title-eng type-line-1">Wedding Invitation</div>
                
                <div class="typing-text names type-line-2">정범영 &amp; 방소현</div>
                
                <div class="type-line-3 date">2026년 10월 9일 금요일 오후 5시<br>가천컨벤션센터</div>
            </div>
        </section>

        <section class="sec-invite fade-up">
            <h2>초대합니다</h2>
            <p>
                서로가 마주보며 다져온 사랑을<br>
                이제 함께 한 곳을 바라보며<br>
                걸어갈 수 있는 큰 사랑으로 키우고자 합니다.<br><br>
                저희 두 사람이 사랑의 이름으로<br>
                지켜나갈 수 있게 앞날을<br>
                축복해 주시면 감사하겠습니다.
            </p>
            <div class="sub-photos">
                <div class="sub-photo-item">
                    <img src="images/sub_1.webp" alt="신랑 서브 사진" loading="lazy">
                    <span>신랑 정범영</span>
                </div>
                <div class="sub-photo-item">
                    <img src="images/sub_2.webp" alt="신부 서브 사진" loading="lazy">
                    <span>신부 방소현</span>
                </div>
            </div>
        </section>

        <section class="sec-gallery fade-up">
            <h2 class="title-eng">Gallery</h2>
            <div class="grid" id="defaultGallery">
                <img src="images/gallery-1.webp" alt="갤러리 1" loading="lazy">
                <img src="images/gallery-2.webp" alt="갤러리 2" loading="lazy">
                <img src="images/gallery-3.webp" alt="갤러리 3" loading="lazy">
                <img src="images/gallery-4.webp" alt="갤러리 4" loading="lazy">
                <img src="images/gallery-5.webp" alt="갤러리 5" loading="lazy">
                <img src="images/gallery-6.webp" alt="갤러리 6" loading="lazy">
            </div>
            <div class="grid hidden-gallery" id="moreGallery">
                <img src="images/gallery-7.webp" alt="갤러리 7" loading="lazy">
                <img src="images/gallery-8.webp" alt="갤러리 8" loading="lazy">
                <img src="images/gallery-9.webp" alt="갤러리 9" loading="lazy">
            </div>
            <button class="more-btn" id="moreBtn" onclick="toggleGallery()">사진 더보기 ∨</button>
        </section>

        <section class="sec-calendar fade-up">
            <h2 class="title-eng" style="color: #1c1c1c;">Save the Date</h2>
            <div style="margin-top: 1.5rem;">
                <img src="images
