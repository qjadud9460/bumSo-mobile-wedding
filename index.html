    <meta property="og:description" content="2026년 10월 9일 오후 5시, 저희의 소중한 날에 초대합니다." />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            color: #333;
            font-size: 16px; 
            overflow-y: scroll;
        }
        
        .wrap { 
            width: 100%; 
            max-width: 430px; 
            background-color: white; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            overflow-x: hidden; 
            position: relative; 
            padding-bottom: 70px; 
        }
        
        section { padding: 4rem 1.5rem; text-align: center; }
        .title-eng { font-size: 1.8rem; color: #1c1c1c; font-weight: 700; margin-bottom: 0.5rem; }
        
        /* 스크롤 애니메이션 */
        .fade-up { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease-out, transform 0.8s ease-out; }
        .fade-up.active { opacity: 1; transform: translateY(0); }

        /* 메인 섹션 */
        .sec-main { 
            background-color: #fad4da; 
            padding: 0; 
            padding-bottom: 3rem;
            margin-bottom: 0;
            position: relative; 
        }
        .sec-main img {
            width: 100%; 
            height: 550px; 
            object-fit: cover; 
            display: block; 
        }

        .sec-main .main-content {
            padding: 0 1.5rem;
            margin-top: 3rem;
        }
        .sec-main .names { font-size: 1.3rem; font-weight: bold; margin-top: 1.5rem; letter-spacing: 2px; }
        .sec-main .date { font-size: 1rem; margin-top: 1rem; line-height: 1.6; }

        /* 초대글 섹션 */
        .sec-invite { 
            background-color: #e5dfd5; 
            padding: 0; 
        }
        .sec-invite img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* 갤러리 섹션 (좌우 여백 없음, 3열 6행 = 총 18장) */
        .sec-gallery { 
            background-color: #000; 
            padding: 0 !important; 
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 2px; 
            margin: 0; 
            padding: 0;
        }
        .grid img {
            width: 100%;
            aspect-ratio: 1 / 1; 
            object-fit: cover; 
            display: block;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .grid img:active {
            opacity: 0.8;
        }

        /* 팝업 라이트박스 스타일 */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            touch-action: pan-y; /* 수직 스크롤 방지 및 모바일 스와이프 제어 최적화 */
        }
        .lightbox.active {
            display: flex;
        }
        .lightbox img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 2rem;
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px;
            z-index: 10000;
        }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            font-size: 1.5rem;
            padding: 15px 12px;
            cursor: pointer;
            border-radius: 50%;
            z-index: 10000;
        }
        .lightbox-prev { left: 15px; }
        .lightbox-next { right: 15px; }
        .lightbox-counter {
            color: #aaa;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        /* 달력 섹션 */
        .sec-calendar { 
            background-color: #fad4da; 
            padding: 0; 
        }
        .sec-calendar img { 
            width: 100%; 
            height: auto; 
            display: block; 
            border-radius: 0; 
            box-shadow: none; 
        }

        /* 주차 및 식사 */
        .sec-info { background-color: #ffffff; padding: 5rem 1.5rem; }
        .parking-title { font-size: 1.3rem; color: #e5a4af; font-weight: bold; margin-bottom: 2rem; }
